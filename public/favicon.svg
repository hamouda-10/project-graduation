<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Obsidian Deep Dark Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#09090b" stroke="url(#goldGrad)" stroke-width="2" />
  <rect x="5" y="5" width="54" height="54" rx="13" fill="url(#goldGlow)" />

  <!-- Stylized M + Microphone Capsule in Center -->
  <!-- Left Pillar of M -->
  <path d="M16 44 L16 22 L24 33" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Right Pillar of M -->
  <path d="M48 44 L48 22 L40 33" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Center Microphone Capsule Formed by M's Central Axis -->
  <rect x="27.5" y="16" width="9" height="15" rx="4.5" fill="url(#goldGrad)" />
  
  <!-- Microphone Stand Cradle Arc connecting under capsule -->
  <path d="M24 25 C24 33.5 40 33.5 40 25" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M32 33 L32 38" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M27 38 L37 38" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Intelligent Pulse Sparkle Dot -->
  <circle cx="32" cy="45" r="2" fill="#FDE68A" />
</svg>
